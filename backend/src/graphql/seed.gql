Round-robin schedule per 3-team group: R1 = team1 v team2, R2 = team1 v team3,
R3 = team2 v team3. Rounds are created directly under the Stage (Round.stage
is always set, per the group-stage schema change) - Step14b then attaches
each round to its Group via the separate IN_GROUP edge.
mutation Step14a_CreateGroupRounds {
  updateStages(
    where: { name: { eq: "Group Stage" } }
    update: {
      rounds: {
        create: [
          { node: { name: "Group A - Round 1: UOC vs UOM" } }
          { node: { name: "Group A - Round 2: UOC vs USJ" } }
          { node: { name: "Group A - Round 3: UOM vs USJ" } }
          { node: { name: "Group B - Round 1: UOK vs UOP" } }
          { node: { name: "Group B - Round 2: UOK vs UOJ" } }
          { node: { name: "Group B - Round 3: UOP vs UOJ" } }
          { node: { name: "Group C - Round 1: UOR vs WUS" } }
          { node: { name: "Group C - Round 2: UOR vs SEU" } }
          { node: { name: "Group C - Round 3: WUS vs SEU" } }
          { node: { name: "Group D - Round 1: SUS vs EUS" } }
          { node: { name: "Group D - Round 2: SUS vs UWU" } }
          { node: { name: "Group D - Round 3: EUS vs UWU" } }
        ]
      }
    }
  ) {
    stages {
      rounds { id name }
    }
  }
}

