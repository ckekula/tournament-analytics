mutation Step2_CreateTournament {
  createTournaments(input: [{ slug: "slug-2027", name: "Sri Lanka University Games 2027", season: "2027" }]) {
    tournaments { id slug name }
  }
}

mutation Step3a_LinkOrganizerToTournament {
  updateOrganizations(
    where: { slug: { eq: "slusa" } }
    update: {
      organizedTournaments: {
        connect: [{ where: { node: { slug: { eq: "slug-2027" } } } }]
      }
    }
  ) {
    organizations {
      slug
      organizedTournaments { slug name }
    }
  }
}

mutation Step3b_LinkRegisteredOrgsToTournament {
  updateTournaments(
    where: { slug: { eq: "slug-2027" } }
    update: {
      registeredOrganizations: {
        connect: [
          { where: { node: { slug: { eq: "uoc" } } } }
          { where: { node: { slug: { eq: "uop" } } } }
          { where: { node: { slug: { eq: "usj" } } } }
          { where: { node: { slug: { eq: "uok" } } } }
          { where: { node: { slug: { eq: "uom" } } } }
          { where: { node: { slug: { eq: "uoj" } } } }
          { where: { node: { slug: { eq: "uor" } } } }
          { where: { node: { slug: { eq: "eus" } } } }
          { where: { node: { slug: { eq: "seu" } } } }
          { where: { node: { slug: { eq: "sus" } } } }
          { where: { node: { slug: { eq: "wus" } } } }
          { where: { node: { slug: { eq: "uwu" } } } }
        ]
      }
    }
  ) {
    tournaments {
      slug
      registeredOrganizations { slug }
    }
  }
}

mutation Step4_CreateDisciplines {
  updateTournaments(
    where: { slug: { eq: "slug-2027" } }
    update: { disciplines: { create: [{ node: { name: BASKETBALL } }, { node: { name: TRACK_AND_FIELD } }] } }
  ) {
    tournaments { disciplines { id name } }
  }
}

mutation Step5_CreateCategories {
  updateDisciplines(
    where: { name: { eq: BASKETBALL } }
    update: { categories: { create: [{ node: { name: "Mens" } }, { node: { name: "Womens" } }, { node: { name: "3x3" } }, { node: { name: "5x5" } }] } }
  ) {
    disciplines { categories { id name } }
  }
}

mutation Step6_CreateEvents {
  updateDisciplines(
    where: { name: { eq: BASKETBALL } }
    update: {
      events: {
        create: [
          { node: { name: "Mens 3x3" } }
          { node: { name: "Womens 3x3" } }
          { node: { name: "Mens 5x5", maxTeamsPerOrg: 1 } }
        ]
      }
    }
  ) {
    disciplines { events { id name } }
  }
}

mutation Step7_LinkEventsToCategories {
  mens3x3: updateEvents(
    where: { name: { eq: "Mens 3x3" } }
    update: { categories: { connect: [{ where: { node: { name: { eq: "Mens" } } } }, { where: { node: { name: { eq: "3x3" } } } }] } }
  ) { events { name categories { name } } }

  womens3x3: updateEvents(
    where: { name: { eq: "Womens 3x3" } }
    update: { categories: { connect: [{ where: { node: { name: { eq: "Womens" } } } }, { where: { node: { name: { eq: "3x3" } } } }] } }
  ) { events { name categories { name } } }

  mens5x5: updateEvents(
    where: { name: { eq: "Mens 5x5" } }
    update: { categories: { connect: [{ where: { node: { name: { eq: "Mens" } } } }, { where: { node: { name: { eq: "5x5" } } } }] } }
  ) { events { name categories { name } } }
}

mutation Step8_CreateStages {
  updateEvents(
    where: { name: { eq: "Mens 5x5" } }
    update: {
      stages: {
        create: [
          {
            node: {
              name: "Group Stage"
              format: ROUND_ROBIN
              order: 1
              roundType: HEAD_TO_HEAD
            }
          }
          {
            node: {
              name: "Knockout Stage"
              format: SINGLE_ELIMINATION
              order: 2
              roundType: HEAD_TO_HEAD
            }
          }
        ]
      }
    }
  ) {
    events {
      stages {
        id
        name
      }
    }
  }
}

